<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contactia · Prueba WhatsApp</title><link rel="stylesheet" href="/prueba-whatsapp.css"><script src="/prueba-whatsapp.js" defer></script></head>
<body><main><h1>Prueba de WhatsApp</h1><p>Envío manual al móvil de pruebas configurado. La plantilla contiene una cita ficticia en inglés; no corresponde a una reserva.</p>
<form id="acceso"><label for="clave">Clave del centro de Contactia</label><input id="clave" type="password" autocomplete="current-password" required><button>Acceder</button></form>
<section id="prueba" hidden><p id="config"></p><button id="enviar" disabled>Enviar un WhatsApp de prueba</button><button id="salir">Cerrar sesión</button><p>Máximo un intento cada 15 minutos. Compruebe el mensaje en su móvil.</p></section>
<p id="resultado" role="status" aria-live="polite"></p></main></body></html>
