<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <!-- Adaptación correcta a móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contactia - Asistente de Reservas</title>

  <!-- Nuestro archivo de estilos -->
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- ===================================================== -->
  <!-- 1️⃣ CONTENEDOR PRINCIPAL DEL CHAT                     -->
  <!-- ===================================================== -->

  <div id="chat-container">

    <!-- Cabecera -->
    <div id="chat-header">
      <span id="restaurant-name">🍽️ Contactia</span>
    </div>


    <!-- =================================================== -->
    <!-- 2️⃣ ZONA DONDE APARECEN LOS MENSAJES                -->
    <!-- =================================================== -->

    <div id="chat-box"></div>

    <section id="voice-panel" aria-label="Prototipo de voz" hidden>
      <div class="voice-controls">
        <button id="voice-toggle" type="button" aria-pressed="false">
          🎙️ Iniciar voz
        </button>
        <span id="voice-status" role="status" aria-live="polite">
          Micrófono apagado
        </span>
      </div>
      <p>
        Prototipo de Preview. El audio se procesa con OpenAI; utiliza datos
        ficticios durante las pruebas.
      </p>
    </section>


    <!-- =================================================== -->
    <!-- 3️⃣ ZONA PARA ESCRIBIR                              -->
    <!-- =================================================== -->

    <div id="chat-input">

      <input
        id="user-input"
        type="text"
        placeholder="Escribe tu mensaje..."
        autocomplete="off"
      >

      <button id="send-btn">
        Enviar
      </button>

    </div>

  </div>


  <!-- ===================================================== -->
  <!-- 4️⃣ LÓGICA DEL CHAT                                   -->
  <!--                                                       -->
  <!-- A partir de ahora TODO el JavaScript estará           -->
  <!-- exclusivamente en script.js                           -->
  <!-- ===================================================== -->

  <script src="/lib/ruta-publica.js"></script>
  <script src="/lib/zona-reserva.js"></script>
  <script src="/lib/restaurante-publico.js"></script>
  <script src="/lib/fecha-conversacional.js"></script>
  <script src="/lib/entrada-conversacional.js"></script>
  <script src="/lib/conocimiento-restaurante.js"></script>
  <script src="/script.js"></script>
  <script src="/voz.js"></script>

</body>

</html>
