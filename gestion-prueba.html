<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Gestionar mi reserva · Contactia</title><link rel="stylesheet" href="acceso-restaurante.css"><link rel="stylesheet" href="reserva-prueba.css"><link rel="stylesheet" href="gestion-prueba.css"><script src="gestion-prueba.js" defer></script></head>
<body><main><header><p class="marca">CONTACTIA · PRUEBAS</p><h1>Gestionar mi reserva</h1><p class="nota">Este enlace es privado. Quien lo tenga podrá consultar y gestionar esta reserva.</p></header>
<section class="tarjeta"><p id="estado" role="status" aria-live="polite">Consultando la reserva…</p><button id="consultar-de-nuevo" type="button" hidden>Volver a consultar</button><div id="contenido" hidden>
<h2 id="restaurante"></h2><p id="referencia" class="nota"></p><dl id="datos"></dl>
<form id="cambio"><fieldset id="campos" disabled><legend>Cambiar fecha u hora</legend><p class="nota">Se mantienen las personas, la zona y las mesas de su reserva.</p><div class="fila"><div><label for="fecha">Nueva fecha</label><input type="date" id="fecha" required></div><div><label for="hora">Nueva hora</label><input type="time" id="hora" required step="60"></div><button id="guardar">Confirmar cambio</button></div></fieldset></form>
<div class="acciones"><button id="cancelar" type="button" class="peligro" disabled>Cancelar reserva</button><button id="actualizar" type="button">Actualizar datos</button><button id="reintentar" type="button" hidden>Reintentar operación pendiente</button></div>
</div><p class="nota">Reserva de desarrollo. No se enviarán correos ni WhatsApp.</p></section></main></body></html>
