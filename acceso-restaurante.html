<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Acceso del restaurante · Contactia</title>
  <link rel="stylesheet" href="acceso-restaurante.css">
  <script src="acceso-restaurante.js" defer></script>
</head>
<body>
<main>
  <header><p class="marca">CONTACTIA</p><h1>Tu restaurante, a mano.</h1>
    <p class="nota">Espacio de pruebas · Todavía no gestiona reservas reales.</p></header>
  <section id="acceso" class="tarjeta" aria-labelledby="titulo-acceso">
    <h2 id="titulo-acceso">Entra en tu cuenta</h2>
    <p>Usa el correo autorizado para gestionar tu restaurante.</p>
    <form id="formulario">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="username" maxlength="254" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" maxlength="1024" required>
      <button id="entrar" type="submit">Entrar</button>
    </form>
    <p class="nota">Si necesitas acceso o recuperar tu cuenta, contacta con la administración de Contactia.</p>
  </section>
  <p id="mensaje" role="status" aria-live="polite"></p>
  <section id="panel" class="tarjeta" hidden aria-labelledby="titulo-panel">
    <div class="cabecera"><div><h2 id="titulo-panel">Mi restaurante</h2><p id="usuario"></p></div>
      <button id="salir" class="secundario" type="button">Cerrar sesión</button></div>
    <label for="restaurante">Restaurante</label>
    <select id="restaurante"></select>
    <button id="actualizar" class="secundario" type="button">Actualizar</button>
    <div id="configuracion" aria-live="polite"></div>
  </section>
</main>
</body>
</html>
